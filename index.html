<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alertas Empleo IT</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --subtext-color: #94a3b8;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      color: var(--accent-color);
      margin-bottom: 25px;
      text-align: center;
    }

    #contenedor-ofertas {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-color);
    }

    .card h2 {
      margin: 0 0 10px 0;
      font-size: 1.25rem;
    }

    .card a {
      color: var(--accent-color);
      text-decoration: none;
    }

    .card a:hover {
      text-decoration: underline;
    }

    .meta {
      display: flex;
      gap: 15px;
      font-size: 0.9rem;
      color: var(--subtext-color);
      flex-wrap: wrap;
    }

    .meta span {
      background: #0f172a;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .estado {
      text-align: center;
      color: var(--subtext-color);
      font-size: 1.1rem;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h1>Alertas Empleo IT</h1>

  <div id="contenedor-ofertas">
    <p class="estado">⏳ Cargando ofertas... (Si Render está dormido, puede tardar unos segundos)</p>
  </div>

  <script>
    // URL de tu API en Render
    const API_URL = 'https://alertas-empleo.onrender.com/api/ofertas';

    async function cargarOfertas() {
      const contenedor = document.getElementById('contenedor-ofertas');

      try {
        const respuesta = await fetch(API_URL);

        if (!respuesta.ok) {
          throw new Error(`HTTP Error: ${respuesta.status}`);
        }

        const ofertas = await respuesta.json();

        if (!Array.isArray(ofertas) || ofertas.length === 0) {
          contenedor.innerHTML = '<p class="estado">ℹ️ No hay ofertas disponibles por ahora.</p>';
          return;
        }

        contenedor.innerHTML = ''; // Limpiar mensaje de carga

        ofertas.forEach(oferta => {
          const card = document.createElement('div');
          card.className = 'card';

          const fecha = oferta.fecha ? new Date(oferta.fecha).toLocaleDateString('es-ES', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          }) : 'Fecha no disponible';

          card.innerHTML = `
            <h2><a href="${oferta.enlace}" target="_blank" rel="noopener noreferrer">${oferta.titulo}</a></h2>
            <div class="meta">
              <span>🏢 ${oferta.empresa || 'Desconocida'}</span>
              <span>📍 ${oferta.ubicacion || 'Remoto'}</span>
              <span>📡 ${oferta.fuente || 'Web'}</span>
              <span>📅 ${fecha}</span>
            </div>
          `;

          contenedor.appendChild(card);
        });

      } catch (error) {
        console.error('Error al cargar ofertas:', error);
        contenedor.innerHTML = '<p class="estado">❌ Error al conectar con el servidor. Revisa que Render esté activo.</p>';
      }
    }

    // Ejecutar al cargar la página
    cargarOfertas();
  </script>
</body>
</html>
