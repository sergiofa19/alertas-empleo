name: Cron Alertas Empleo

on:
  schedule:
    - cron: '0 8,15 * * *'
  workflow_dispatch:

jobs:
  scraping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias de Node
        run: npm install

      - name: Instalar navegador Chrome
        run: npx puppeteer browsers install chrome

      - name: Ejecutar orquestador de ofertas
        run: node obtenerMultiples.js
