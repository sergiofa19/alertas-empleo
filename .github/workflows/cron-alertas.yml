name: Obtener ofertas de empleo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  ejecutar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar script
        run: node obtenerMultiples.js
